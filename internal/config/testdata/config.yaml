knownTriggers:
  "E2E Test Suites": "/run cluster-test-suites"
  "App E2E Test Suites": "/run app-test-suites-single PROVIDER={{suffix}}"
  "Nested": "/run short SUFFIX={{suffix}}"
  "Nested - Check": "/run long SUFFIX={{suffix}}"

ignoredPaths:
  - ".github/**"
  - "README.md"

repos:
  some-repo:
    requiredChecks:
      - "E2E Test Suites"
  override-repo:
    ignoredPaths:
      - "docs/**"
  opt-out-repo:
    ignoredPaths: []
