knownTriggers:
  "E2E Test Suites": "/run cluster-test-suites"
  "Release Test Suites": "/run releases-test-suites"
  "E2E Coverage": "/run releases-test-suites"
  # The per-provider "App E2E Test Suites - <provider>" checks are added
  # dynamically for repos with a ./tests/e2e/config.yaml, so this name is
  # matched by prefix and the provider is substituted into `{{suffix}}`.
  "App E2E Test Suites": "/run app-test-suites-single PROVIDER={{suffix}}"

repos:
  cluster-test-suites:
    requiredChecks:
      - "E2E Test Suites"

  cluster-aws:
    requiredChecks:
      - "E2E Test Suites"
  cluster-eks:
    requiredChecks:
      - "E2E Test Suites"
  cluster-azure:
    requiredChecks:
      - "E2E Test Suites"
  cluster-gcp:
    requiredChecks:
      - "E2E Test Suites"
  cluster-cloud-director:
    requiredChecks:
      - "E2E Test Suites"
  cluster-vsphere:
    requiredChecks:
      - "E2E Test Suites"

  default-apps-aws:
    requiredChecks:
      - "E2E Test Suites"
  default-apps-azure:
    requiredChecks:
      - "E2E Test Suites"
  default-apps-gcp:
    requiredChecks:
      - "E2E Test Suites"
  default-apps-cloud-director:
    requiredChecks:
      - "E2E Test Suites"
  default-apps-vsphere:
    requiredChecks:
      - "E2E Test Suites"

  tinkerers-ci-test-1:
    requiredChecks:
      - "E2E Test Suites"
      - "Foo Bar"

  mc-bootstrap:
    requiredChecks:
      - "Generate MC - capa / goten"
      - "Generate MC - capz / goose"
      - "Generate MC - vsphere / gmc"
      - "Generate MC - cloud-director / goshawk"

  # In addition to the static checks below, an MC creation test ("Generate MC -
  # <provider>") must have run successfully for at least one provider updated in
  # the PR. This is enforced dynamically in cmd/gatekeeper/main.go.
  releases:
    requiredChecks:
      - "Release Test Suites"
      # Requires the full set of test suites for every new release in the PR, not just the
      # ones the current release stage happens to run. Published by the `E2E Coverage`
      # workflow in giantswarm/releases.
      - "E2E Coverage"
